version: "3.9"

services:
  api:
    build: .
    ports:
      - "8001:8001"
    env_file:
      - .env
    environment:
      - LLM_BASE_URL=http://host.docker.internal:1234/v1
      - WDK_PORT=3001
      - WDK_URL=http://wdk:3001
    volumes:
      - ./cache:/app/cache
    command: uvicorn api.main:app --host 0.0.0.0 --port 8001
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - wdk

  wdk:
    build: ./wdk_service
    container_name: wdk-service
    ports:
      - "3001:3001"
    env_file:
      - .env

  web:
    build: .
    ports:
      - "8081:8081"
    env_file:
      - .env
    environment:
      - API_URL=http://api:8001
    depends_on:
      - api
    command: uvicorn web_app.app:app --host 0.0.0.0 --port 8081 --reload
