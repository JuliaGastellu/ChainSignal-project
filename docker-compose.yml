# Compose de desarrollo local. La topología del piloto vive en
# deploy/compose.piloto.yml (E08); este archivo es para trabajar en mi máquina.
#
# Cada proceso recibe solo sus variables: ya no paso el .env completo con
# env_file. Compose sí lee .env para interpolar ${...}, pero solo llegan al
# contenedor las variables que nombro aquí. Ningún proceso de lectura recibe
# seed, token WDK ni destino de rescate.

services:
  # Credenciales solo para desarrollo local; no las uso fuera de esta red.
  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=chainsignal
      - POSTGRES_PASSWORD=chainsignal
      - POSTGRES_DB=chainsignal
    volumes:
      - chainsignal_pgdata:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chainsignal -d chainsignal"]
      interval: 5s
      timeout: 5s
      retries: 5

  # API comercial de solo lectura. No arranca loops; el monitoreo corre en `worker`.
  api:
    build: .
    ports:
      - "8001:8001"
    environment:
      - CHAINSIGNAL_MODE=READ_ONLY
      - CHAINSIGNAL_DISABLE_DOTENV=1
      - DATABASE_URL=postgresql+psycopg2://chainsignal:chainsignal@db:5432/chainsignal
      - ETHEREUM_RPC_URL=${ETHEREUM_RPC_URL:-}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:8081,http://127.0.0.1:8081}
      - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-true}
      - SIGNUP_ENABLED=${SIGNUP_ENABLED:-false}
      - METRICS_TOKEN=${METRICS_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy

  # Monitoreo periódico de solo lectura, separado de la API.
  worker:
    build: .
    command: python -m worker_lectura
    environment:
      - CHAINSIGNAL_MODE=READ_ONLY
      - CHAINSIGNAL_DISABLE_DOTENV=1
      - DATABASE_URL=postgresql+psycopg2://chainsignal:chainsignal@db:5432/chainsignal
      - ETHEREUM_RPC_URL=${ETHEREUM_RPC_URL:-}
    depends_on:
      db:
        condition: service_healthy

  # Experimento de firma en testnet, fuera del producto. Solo arranca con
  # `docker compose --profile experimento up wdk`. No publico el puerto en el
  # host y exige WDK_SERVICE_TOKEN en cada ruta (wdk_service/server.js).
  wdk:
    build: ./wdk_service
    container_name: wdk-service
    profiles: ["experimento"]
    expose:
      - "3001"
    env_file:
      - .env

  # Interfaz heredada en Jinja (web_app/app.py). Quedó fuera del despliegue
  # comercial: solo arranca con `--profile legado` y sin --reload.
  web-legado:
    build: .
    profiles: ["legado"]
    ports:
      - "8082:8081"
    environment:
      - API_URL=http://api:8001
    depends_on:
      - api
    command: uvicorn web_app.app:app --host 0.0.0.0 --port 8081

volumes:
  chainsignal_pgdata:
