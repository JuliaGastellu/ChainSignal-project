# nginx de la interfaz del piloto (E08). TLS lo termina el balanceador o la
# plataforma delante de este contenedor; aquí escucho HTTP interno.

upstream api_chainsignal {
    # API_UPSTREAM se reemplaza al arrancar (plantilla de la imagen oficial de nginx).
    # En Compose es api:8001 y resuelve a todas las réplicas al arrancar nginx.
    server ${API_UPSTREAM} max_fails=2 fail_timeout=10s;
    keepalive 16;
}

server {
    listen 8080;
    server_tokens off;
    root /usr/share/nginx/html;
    client_max_body_size 64k;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; connect-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
    proxy_next_upstream error timeout http_502 http_503;
    proxy_next_upstream_tries 2;

    # Eventos en vivo: sin buffer y con lectura larga.
    location ~ ^/orgs/[^/]+/events/stream$ {
        proxy_pass http://api_chainsignal;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_next_upstream off;
    }

    # /metrics no se publica: se lee desde la red interna con su token.
    location ~ ^/(auth|orgs|demo|practice|invitations|contact|billing|health|ready)(/|$) {
        proxy_pass http://api_chainsignal;
    }

    # Uso expires y no add_header: un add_header en un location anula las
    # cabeceras de seguridad que heredo del server.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    location / {
        expires -1;
        try_files $uri /index.html;
    }
}
