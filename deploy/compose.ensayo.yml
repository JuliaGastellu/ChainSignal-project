# Ensayo local del piloto (E08), aislado: se suma a compose.piloto.yml.
#
#   python -m operacion.ensayo_staging
#
# Diferencias con producción, todas a propósito:
# - APP_ENV=staging y http en 127.0.0.1 (sin TLS ni CORS https);
# - la lectura de Aave V3 se reproduce desde la fixture grabada: no hay RPC real;
# - lease y reintentos cortos para que el ensayo dure minutos.
# DB_AUTO_MIGRATE sigue en false: la migración es el paso aparte, como en producción.

services:
  api:
    environment:
      APP_ENV: staging
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:8088
      SESSION_COOKIE_SECURE: "false"
      SIGNUP_ENABLED: "true"
      AAVE_REPLAY_FIXTURE: ${ENSAYO_FIXTURE-/app/tests/datos/aave_v3_prestatario_usdc_26116392.json}
  worker:
    environment:
      APP_ENV: staging
      AAVE_REPLAY_FIXTURE: ${ENSAYO_FIXTURE-/app/tests/datos/aave_v3_prestatario_usdc_26116392.json}
      ETHEREUM_RPC_URL: ${ENSAYO_RPC_URL-}
      WORKER_POLL_SECONDS: "1"
      WORKER_LEASE_SECONDS: "15"
      WORKER_MAX_ATTEMPTS: "2"
  migrate:
    environment:
      APP_ENV: staging
  web:
    ports: !override
      - "127.0.0.1:8088:8080"
