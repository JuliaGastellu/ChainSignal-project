# Terminación TLS del ensayo (E-final): hace el papel del balanceador de la
# plataforma. Certificado autofirmado de un día, generado por el ensayo.
server {
    listen 8443 ssl;
    server_name localhost;
    ssl_certificate /certs/tls-cert.pem;
    ssl_certificate_key /certs/tls-clave.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://web:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
}
