[pytest]
testpaths = tests
pythonpath = .
python_files = test_*.py
# Por defecto corro solo pruebas unitarias offline. Las integraciones manuales
# se piden explícitamente con: pytest -m integration
addopts = -m "not integration" --strict-markers
markers =
    integration: prueba manual opt-in que usa servicios reales (WDK, RPC, Etherscan, .env local)
    postgres: requiere CHAINSIGNAL_TEST_POSTGRES_URL apuntando a un PostgreSQL desechable
